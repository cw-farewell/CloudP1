# GitLab Runner 需支持 Docker-in-Docker；部署 Job 需要 kubectl 和 KUBECONFIG_FILE 变量。
stages:
  - verify
  - build
  - deploy

variables:
  # 每个提交都使用不可混淆的 commit SHA 标签，避免 latest/dev 指向不确定版本。
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  DOCKER_TLS_CERTDIR: "/certs"

verify-python:
  stage: verify
  image: python:3.12-slim
  script:
    # 先做语法编译检查；这是轻量门禁，不代替后续补充的自动化测试。
    - python -m compileall -q app

build-and-push:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  script:
    # GitLab 提供的 CI_REGISTRY_* 变量用于登录项目镜像仓库。
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy-kubernetes:
  stage: deploy
  image:
    name: bitnami/kubectl:1.31
    entrypoint: [""]
  needs:
    - build-and-push
  script:
    # KUBECONFIG_FILE 是 GitLab 的 File 类型 CI/CD 变量，内容为目标集群 kubeconfig。
    - test -n "$KUBECONFIG_FILE" || (echo "请配置 KUBECONFIG_FILE 文件变量" && exit 1)
    - export KUBECONFIG="$KUBECONFIG_FILE"
    - kubectl config current-context
    - kubectl set image deployment/todo-api api="$IMAGE_TAG" -n cloudp1
    - kubectl rollout status deployment/todo-api -n cloudp1 --timeout=180s
    # 将提交 SHA 记录为 Deployment 注解，便于事后确认集群运行版本。
    - kubectl annotate deployment/todo-api -n cloudp1 "app.kubernetes.io/version=$CI_COMMIT_SHORT_SHA" --overwrite
  rules:
    # 仅默认分支自动发布；其他分支只做检查和构建推送。
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
