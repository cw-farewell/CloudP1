# Redis 是本 Demo 的数据依赖。此处使用单副本，便于演示；不是高可用 Redis 方案。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cloudp1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          # AOF 让 Redis 重启时尝试从数据文件恢复；本地演示仍不等同于备份。
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          # 资源请求用于调度，限制用于避免单个容器无限占用节点资源。
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
# Service 给 Redis 提供稳定 DNS 名称；Pod 重建后 IP 变化，API 仍连 redis:6379。
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cloudp1
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
