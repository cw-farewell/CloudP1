# Grafana 教学配置：预置 Prometheus 数据源和 API 请求速率面板。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: cloudp1
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        # 面板 JSON 中也使用此 UID，确保面板能找到这个数据源。
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: CloudP1
        orgId: 1
        folder: CloudP1
        type: file
        options:
          path: /var/lib/grafana/dashboards
  dashboard.json: |
    {
      "title": "CloudP1 API",
      "uid": "cloudp1-api",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "15s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "API 请求速率（每秒）",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (path, status) (rate(todo_http_requests_total{job=\"todo-api\"}[5m]))",
              "legendFormat": "{{path}} status={{status}}",
              "range": true
            }
          ]
        },
        {
          "id": 2,
          "title": "待办业务 API 请求延迟 P95（秒）",
          "description": "按 HTTP 方法和固定路由显示过去 5 分钟请求延迟的 P95；排除监控与健康检查路由。Histogram 桶边界会影响分位数估算精度。",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 9},
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, method, path) (rate(todo_http_request_duration_seconds_bucket{job=\"todo-api\",path!~\"/metrics|/healthz|/readyz\"}[5m])))",
              "legendFormat": "{{method}} {{path}} P95",
              "range": true
            }
          ]
        },
        {
          "id": 3,
          "title": "API 可用性（2xx 占比）",
          "description": "业务路径的 2xx 占比，排除探针与监控路径。与 docs/slo.md 的 SLO-1 口径一致。没有业务流量时分母为 0，面板显示 No data 而不是 0%，因为 0/0 不表示服务不可用。",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 18},
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 0.95},
                  {"color": "green", "value": 0.99}
                ]
              },
              "color": {"mode": "thresholds"}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(todo_http_requests_total{job=\"todo-api\",path!~\"/healthz|/readyz|/metrics\",status=~\"2..\"}[5m])) or vector(0)) / sum(rate(todo_http_requests_total{job=\"todo-api\",path!~\"/healthz|/readyz|/metrics\"}[5m]))",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 4,
          "title": "5xx 比例",
          "description": "业务路径的 5xx 占比。没有业务流量时显示 No data，表示无从判断，而不是 0%。",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 18},
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.01},
                  {"color": "red", "value": 0.05}
                ]
              },
              "color": {"mode": "thresholds"}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(todo_http_requests_total{job=\"todo-api\",path!~\"/healthz|/readyz|/metrics\",status=~\"5..\"}[5m])) or vector(0)) / sum(rate(todo_http_requests_total{job=\"todo-api\",path!~\"/healthz|/readyz|/metrics\"}[5m]))",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 5,
          "title": "采集中的 API 实例数",
          "description": "up=1 的 API Pod 数量。副本数应为 2，掉到 1 或 0 说明采集或 Pod 出了问题。",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 18},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "green", "value": 2}
                ]
              },
              "color": {"mode": "thresholds"}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{job=\"todo-api\"})",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 6,
          "title": "业务请求速率（2xx / 5xx）",
          "description": "只看业务路径，排除探针。两条曲线对比，用来判断错误是在增加还是只是请求量下降。",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 18},
          "fieldConfig": {
            "defaults": {"unit": "reqps", "min": 0},
            "overrides": []
          },
          "targets": [
            {"refId": "A", "expr": "sum(rate(todo_http_requests_total{job=\"todo-api\",path!~\"/healthz|/readyz|/metrics\",status=~\"2..\"}[5m]))", "legendFormat": "2xx", "range": true},
            {"refId": "B", "expr": "sum(rate(todo_http_requests_total{job=\"todo-api\",path!~\"/healthz|/readyz|/metrics\",status=~\"5..\"}[5m]))", "legendFormat": "5xx", "range": true}
          ]
        },
        {
          "id": 7,
          "title": "抓取状态（每 Pod）",
          "description": "1 表示能抓到该 Pod 的指标，0 表示抓取失败。演练断流时这条线最先掉。",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 24},
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1.1,
              "decimals": 0,
              "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never"}
            },
            "overrides": []
          },
          "targets": [
            {"refId": "A", "expr": "up{job=\"todo-api\"}", "legendFormat": "{{instance}}", "range": true}
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cloudp1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          ports:
            - name: web
              containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboard-provider.yaml
              subPath: dashboard-provider.yaml
              readOnly: true
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/cloudp1-api.json
              subPath: dashboard.json
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cloudp1
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: web
