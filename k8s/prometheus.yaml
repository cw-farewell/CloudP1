# Prometheus 抓取范围通过 Pod 发现确定，而不是抓 Service。
#
# 为什么不用 Service DNS：Service 后面有两个 API Pod，Prometheus 每次抓取可能落到不同的
# Pod，但 instance 标签只有一个值，两个 Pod 的计数器会被当成同一条序列，表现为计数器忽增忽减，
# rate() 和 histogram_quantile() 都算不出可信结果。
#
# 现在改为 role: pod，一个 Pod 一个 target，instance 用 Pod 名，并保留 pod 与 namespace 标签。

# Prometheus 需要读 Pod 列表才能发现抓取目标。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: cloudp1
---
# 权限只给本命名空间的 pods 读操作，不给额外权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-reader
  namespace: cloudp1
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-reader
  namespace: cloudp1
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: cloudp1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pod-reader
---
# 教学用 Prometheus：按 Pod 发现抓取 API 的 /metrics。
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloudp1
data:
  prometheus.yml: |
    global:
      # 每 15 秒采集一次，便于观察且适合本地练习。
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: todo-api
        metrics_path: /metrics
        kubernetes_sd_configs:
          # 只在本命名空间内发现 Pod，配合上面的 Role 就够用。
          - role: pod
            namespaces:
              names:
                - cloudp1
        relabel_configs:
          # 只保留带 app=todo-api 标签的 Pod。
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: todo-api
            action: keep
          # 只保留声明了 http 端口的容器，避免抓到 sidecar 或其它端口。
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          # 抓取地址用 Pod IP 加容器端口，而不是 Service DNS。
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_container_port_number]
            separator: ":"
            target_label: __address__
          # instance 用 Pod 名，比 IP 好读，重建后也能对上。
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
  alerts.yml: |
    groups:
      - name: todo-api
        rules:
          # 教学 SLO：最近 5 分钟抓取目标至少 99% 可用（仅代表监控采集可达）。
          - alert: TodoApiScrapeAvailabilityLow
            expr: avg_over_time(up{job="todo-api"}[5m]) < 0.99
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Todo API 指标采集可用率低于 99%"
              description: "Prometheus 最近 5 分钟无法稳定抓取 todo-api。"
          # 有请求样本且 5xx 比例超过 5% 持续 2 分钟时告警。
          - alert: TodoApiHigh5xxRate
            expr: |
              sum(rate(todo_http_requests_total{job="todo-api",status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(todo_http_requests_total{job="todo-api"}[5m])), 0.001)
              > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Todo API 5xx 错误比例超过 5%"
              description: "最近 5 分钟请求中 5xx 比例超过 5%，并持续 2 分钟。"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cloudp1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # 使用上面创建的 ServiceAccount，才会带上读 Pod 的权限。
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: config
              mountPath: /etc/prometheus/alerts.yml
              subPath: alerts.yml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cloudp1
spec:
  # 仅集群内可访问；本机通过 kubectl port-forward 打开界面。
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
